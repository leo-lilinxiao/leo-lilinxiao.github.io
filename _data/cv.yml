cv:
  name: Leo (Linxiao) Li
  label: AI Infrastructure & LLM Systems Researcher
  email: llinxiao520@gmail.com
  location: Shanghai, China
  image: prof_pic.jpg
  summary: >
    Machine learning systems researcher focusing on efficient training and inference for large-scale language models.
    My work studies system-level optimizations including MFU improvement, communication–computation overlap,
    MoE inference optimization, and hardware-efficient execution for large-scale AI infrastructure.
    <br><br>
    Currently AI Infrastructure / Training Systems Researcher at <a href="https://www.autocoder.cc/platform">AIGCode (蔻町科技)</a>.
    Previously Senior Algorithm Researcher at <a href="https://www.huaweicloud.com/lab/cloud/home.html">Huawei Cloud Architecture Innovation Lab</a>.
    Bachelor of Computer Science from the University of Sydney.

