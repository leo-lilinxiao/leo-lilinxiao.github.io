    Selected Research Projects:
      - name: Ascend NPU User-Space Virtualization
        summary: >
          Designed a user-space virtualization framework for Ascend NPUs to improve hardware utilization in large-scale AI training.
        highlights:
          - 'Achieved <span class="cv-highlight"><3% performance overhead</span> while increasing NPU utilization from 10% to 30%'

      - name: MoE Inference Memory Offloading
        summary: >
          Designed a memory offloading framework for large-scale Mixture-of-Experts inference to reduce GPU memory pressure.
        highlights:
          - 'Achieved <span class="cv-highlight"><3% overhead</span> while maintaining TTFT <3s and TPOT <100ms in production systems'
          - '<span class="cv-highlight">Huawei Cloud High-Potential Patent</span>: A MoE Model-Oriented Inference Optimization Method'

      - name: ""
        summary: 'Both projects were deployed in Huawei Cloud and announced at <a href="https://live.huawei.com/hdc2025/meeting/cn/15569.html">Huawei HDC 2025</a> (~50 min mark).'

    Experience:
      - company: AIGCode (蔻町科技)
        position: AI Infrastructure / Training Systems Researcher
        location: Shanghai, China
        url: https://www.autocoder.cc/platform
        start_date: 2025-11
        end_date: ""
        summary: Leading LLM pre-training optimization and training infrastructure. Currently leading pre-training of a 300B+ parameter LLM from scratch.
        highlights:
          - "Achieved 5x single-operator speedup (MoE Combine + FFN), improving overall MFU by 10% and reducing training cost by >10%"
          - 'Tech stack: Triton, TileLang, <a href="https://gitcode.com/lllleo/pypto">PyPTO</a> with Tile paradigm programming'
          - "Profiling tools for end-to-end optimization. Building next-generation AI Infra and model architectures."

      - company: Huawei Technologies Co., Ltd.
        position: Senior Algorithm Researcher Leader / PL (Huawei Fellow Team)
        location: Shenzhen, China
        start_date: 2023-09
        end_date: 2025-11
        summary: Core member of <a href="https://www.huaweicloud.com/lab/cloud/home.html">Huawei Cloud Architecture Innovation Lab (Cloud Lab)</a>, under <a href="https://developer.huawei.com/consumer/cn/forum/topic/0202743458671690687">CTO Fellow Jiongjiong Gu</a> (Chief Architect). Led a 10+ person joint team with the <a href="https://www.gml.ac.cn/kytd/189.html">Guangming Laboratory</a> on intelligent resource scheduling. All annual performance ratings A.
        highlights:
          - '<strong>MoE Memory Offloading</strong>: Expert offloading for MoE LLM inference on Ascend NPUs. TTFT &lt;3s, TPOT &lt;100ms. Supports BF16/W8A8 (DeepSeek V3). (<a href="https://live.huawei.com/hdc2025/meeting/cn/15569.html">HDC 2025</a>, ~50 min)'
          - '<strong>NPU User-Space Virtualization</strong>: Multi-tenant NPU sharing with &lt;3% overhead, utilization 10%→30%+. (<a href="https://live.huawei.com/hdc2025/meeting/cn/15569.html">HDC 2025</a>, ~50 min)'
          - '<strong><a href="https://www.huaweicloud.com/intl/en-us/product/flexus-x.html">Huawei Cloud Flexus</a> FRCP</strong>: iTransformer capacity prediction for X/L instances, deployed at scale.'
          - '<strong>QoS MoE Model</strong>: MAE 3%, classification accuracy 99.995%. Key support for Agricultural Bank of China HCS project.'

      - company: Huawei Technologies Co., Ltd.
        position: Software Development Leader
        location: Chengdu, China
        start_date: 2021-09
        end_date: 2023-08
        summary: Led 5-person team as Committer. Core developer on <a href="https://www.huaweicloud.com/product/dwr.html">Data Workshop</a> distributed messaging system. (incl. internship from Sep 2021)
        highlights:
          - "Built on Pulsar distributed messaging middleware with self-developed storage engine"
