cv:
  name: Leo (Linxiao) Li
  label: AI Infrastructure & LLM Systems Researcher
  email: llinxiao520@gmail.com
  location: Shanghai, China
  image: prof_pic.jpg
  summary: >
    Machine learning systems researcher focusing on efficient training and inference for large-scale language models.
    My work studies system-level optimizations including MFU improvement, communication–computation overlap,
    MoE inference optimization, and hardware-efficient execution for large-scale AI infrastructure.
    <br><br>
    Currently AI Infrastructure / Training Systems Researcher at <a href="https://www.autocoder.cc/platform">AIGCode (蔻町科技)</a>.
    Previously Senior Algorithm Researcher at <a href="https://www.huaweicloud.com/lab/cloud/home.html">Huawei Cloud Architecture Innovation Lab</a>.
    Bachelor of Computer Science from the University of Sydney.

  social_networks:
    - network: GitHub
      username: leo-lilinxiao
    - network: LinkedIn
      username: leo-li-446371103

  sections:
    Publications:
      - title: "Deterministic Component Mining for Multi-framework UI2Code Generation"
        date: 2026
        publisher: "ICML 2026"
        url: https://icml.cc/virtual/2026/poster/64878
        summary: "Zixiong Yang*, Linxiao Li*, Jiaye Lin, Binrui Wu, Xiaoyu Kang, Jiechao Gao†. Co-first author. (* Equal contribution, † Corresponding author)"

      - title: "EcoThink: A Green Adaptive Inference Framework for Sustainable and Accessible Agents"
        date: 2026
        publisher: "ACM Web Conference (WWW'26)"
        url: https://arxiv.org/abs/2603.25498
        summary: "Linxiao Li*, Zhixiang Lu*. Co-first author. Average 40.4% energy savings for LLM agents. (* Equal contribution)"

    Selected Research Projects:
      - name: Ascend NPU User-Space Virtualization
        summary: >
          Designed a user-space virtualization framework for Ascend NPUs to improve hardware utilization in large-scale AI training.
        highlights:
          - 'Achieved <span class="cv-highlight"><3% performance overhead</span> while increasing NPU utilization from 10% to 30%'

      - name: MoE Inference Memory Offloading
        summary: >
          Designed a memory offloading framework for large-scale Mixture-of-Experts inference to reduce GPU memory pressure.
        highlights:
          - 'Achieved <span class="cv-highlight"><3% overhead</span> while maintaining TTFT <3s and TPOT <100ms in production systems'
          - '<span class="cv-highlight">Huawei Cloud High-Potential Patent</span>: A MoE Model-Oriented Inference Optimization Method'

      - name: ""
        summary: 'Both projects were deployed in Huawei Cloud and announced at <a href="https://live.huawei.com/hdc2025/meeting/cn/15569.html">Huawei HDC 2025</a> (~50 min mark).'

